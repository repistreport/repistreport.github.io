<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>REP İstanbul</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f3fb; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- rep-app.com kabuğu: önce köprü (RepApp_Kopru; giriş + güvenlik + yönlendirme), sonra seçilen uygulama aynı iframe'de açılır. -->
  <!-- credentialless: Google çerezleri gönderilmez, böylece çoklu Google hesabında /u/1/ hatası olmaz. -->
  <iframe id="rep" credentialless title="REP İstanbul" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <script>
    var KOPRU_EXEC = 'https://script.google.com/macros/s/AKfycbz-HUdmwpaE2gnwK9pX28lNFIvAz9hB2rpcc3AsVTwvItUr9STu5k6kfFWY-Ivr9RACPA/exec';
    var YOL = 'ticari1';
    var cerceve = document.getElementById('rep');
    var q = new URLSearchParams(location.search);
    q.set('kabuk', '1'); if (YOL) q.set('yol', YOL);
    cerceve.src = KOPRU_EXEC + '?' + q.toString();
    // Köprü, kullanıcıyı doğrulayınca hedef uygulamanın adresini gönderir; yalnız Google Apps Script web uygulaması adresleri kabul edilir.
    window.addEventListener('message', function(e) {
      if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
      var d = e.data || {};
      if (d.repKopru === 'git' && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\?/.test(d.url || '')) cerceve.src = d.url;
    });
  </script>
</body>
</html>
